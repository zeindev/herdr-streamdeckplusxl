id = "dev.herdr.streamdeck"
name = "Herdr Stream Deck"
version = "0.1.4"
min_herdr_version = "0.8.0"
description = "A control surface for running several development workstreams in parallel."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install-streamdeck.ps1"]
platforms = ["windows"]

[[build]]
command = ["sh", "scripts/install-streamdeck.sh"]
platforms = ["linux", "macos"]

# Herdr-side enrichment (ADR-0004, ADR-0006): derives a workstream's ticket
# list from Git and publishes it as the workspace token `sd_tickets`. Runs in
# the Herdr plugin process, independently of the Stream Deck app.
[[startup]]
command = ["node", "scripts/herdr-tickets.mjs", "startup"]

[[events]]
on = "worktree.created"
command = ["node", "scripts/herdr-tickets.mjs", "worktree-created"]

[[events]]
on = "worktree.opened"
command = ["node", "scripts/herdr-tickets.mjs", "worktree-opened"]

# Herdr-side enrichment (ADR-0004, ticket -7bl): works out a workstream's
# GitHub pull-request state and publishes it as the workspace token `sd_pr`.
# Each of these also makes sure a background poll loop is running for that
# workspace, since nothing local ever fires when a review or check changes
# on GitHub's side — see the header of scripts/herdr-pr.mjs for why.
[[startup]]
command = ["node", "scripts/herdr-pr.mjs", "startup"]

[[events]]
on = "worktree.created"
command = ["node", "scripts/herdr-pr.mjs", "worktree-created"]

[[events]]
on = "worktree.opened"
command = ["node", "scripts/herdr-pr.mjs", "worktree-opened"]

# Herdr-side enrichment (ADR-0004, ADR-0001, ticket -0vd.1): publishes the
# workstream's actual current branch as the workspace token `sd_branch`, so a
# `git switch` or `git checkout` — which pushes no Herdr event of any kind —
# still reaches the device. Each of these also makes sure this worktree's own
# post-checkout hook calls back into the script, since nothing on Herdr's
# socket ever fires for a branch change made from the terminal.
[[startup]]
command = ["node", "scripts/herdr-branch.mjs", "startup"]

[[events]]
on = "worktree.created"
command = ["node", "scripts/herdr-branch.mjs", "worktree-created"]

[[events]]
on = "worktree.opened"
command = ["node", "scripts/herdr-branch.mjs", "worktree-opened"]
